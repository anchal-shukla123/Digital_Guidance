<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGuide - Colleges Directory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="colleges.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html"><h3>EduGuide</h3></a>
        <nav>
            <ul class="nav_links"> 
                <li><a href="career.html">Take Quiz</a></li>
                <li><a href="colleges.html">Colleges</a></li>
                <li><a href="#timeline">Timeline</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <span class="welcome-text" id="welcomeText" style="display: none;"></span>
            <button id="profileBtn" class="navBtn" style="display: none;">Profile</button>
            <button id="loginBtn" class="navBtn">Login</button>
            <button id="logoutBtn" class="navBtn logout-btn" style="display: none;">Logout</button>
        </div>
    </header>
    <div class="container">
        <!-- Filter Sidebar -->
        <aside class="filter-sidebar">
            <h2><i class="fas fa-filter"></i> Filters</h2>

            <!-- Search Box -->
            <div class="filter-group">
                <label>Search College</label>
                <input type="text" class="search-box" id="searchBox" placeholder="Search by name...">
            </div>

            <!-- Type of College -->
            <div class="filter-group">
                <label>Type of College</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="typeGov" value="Government">
                        <label for="typeGov">Government</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="typePrivate" value="Private">
                        <label for="typePrivate">Private</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="typeDeemed" value="Deemed">
                        <label for="typeDeemed">Deemed</label>
                    </div>
                </div>
            </div>

            <!-- Location -->
            <div class="filter-group">
                <label>Location</label>
                <select id="locationFilter">
                    <option value="">All Locations</option>
                </select>
            </div>

            <!-- Course Offered -->
            <div class="filter-group">
                <label>Course Offered</label>
                <div class="checkbox-group" id="courseCheckboxes">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- Medium of Instruction -->
            <div class="filter-group">
                <label>Medium of Instruction</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="mediumEng" value="English">
                        <label for="mediumEng">English</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="mediumHindi" value="Hindi">
                        <label for="mediumHindi">Hindi</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="mediumOther" value="Other">
                        <label for="mediumOther">Other</label>
                    </div>
                </div>
            </div>

            <!-- Rating Slider -->
            <div class="filter-group">
                <label>Minimum Rating</label>
                <div class="slider-container">
                    <div class="slider-value">
                        <span>1 <i class="fas fa-star"></i></span>
                        <span id="ratingValue">3 <i class="fas fa-star"></i></span>
                    </div>
                    <input type="range" id="ratingSlider" min="1" max="5" value="3" step="0.5">
                </div>
            </div>

            <!-- Fees Range Slider -->
            <div class="filter-group">
                <label>Fees Range (₹ Lakhs)</label>
                <div class="slider-container">
                    <div class="slider-value">
                        <span>₹0L</span>
                        <span id="feesValue">₹10L</span>
                    </div>
                    <input type="range" id="feesSlider" min="0" max="20" value="10" step="1">
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="btn btn-secondary" id="resetBtn">Reset</button>
                <button class="btn btn-primary" id="applyBtn">Apply</button>
            </div>
        </aside>

        <!-- Colleges List -->
        <main class="colleges-list">
            <div class="results-header">
                <div class="results-count" id="resultsCount">Showing 0 Colleges</div>
                <div class="sort-by">
                    <select id="sortBy">
                        <option value="default">Sort By: Default</option>
                        <option value="rating">Rating (High to Low)</option>
                        <option value="fees">Fees (Low to High)</option>
                        <option value="name">Name (A to Z)</option>
                    </select>
                </div>
            </div>

            <div id="collegesContainer">
                <!-- College cards will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="collegeModal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h2 id="modalCollegeName" style="color: #0088A9; margin-bottom: 20px;"></h2>
            <div id="modalCollegeDetails"></div>
        </div>
    </div>

    <!-- Import Database -->
    <script src="db.js"></script>

    <script>
        let filteredColleges = [];
        let db; // Reference to college database

        // Initialize page
        function init() {
            // Initialize database reference
            db = window.collegeDB || window.db;
            
            if (!db) {
                console.error('Database not loaded!');
                return;
            }
            
            // Populate dynamic filters
            populateLocationFilter();
            populateCourseCheckboxes();
            
            // Display all colleges initially
            filteredColleges = db.getAllColleges();
            displayColleges(filteredColleges);
            
            // Setup event listeners
            setupEventListeners();
            
            // Log database statistics
            console.log('Database Statistics:', db.getStatistics());
        }

        // Populate location filter dynamically
        function populateLocationFilter() {
            const locationSelect = document.getElementById('locationFilter');
            const locations = db.getUniqueLocations();
            
            locations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                locationSelect.appendChild(option);
            });
        }

        // Populate course checkboxes dynamically
        function populateCourseCheckboxes() {
            const container = document.getElementById('courseCheckboxes');
            const courses = db.getAllCourses();
            
            courses.forEach((course, index) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `course${index}`;
                checkbox.value = course;
                
                const label = document.createElement('label');
                label.htmlFor = `course${index}`;
                label.textContent = course;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                container.appendChild(div);
            });
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Slider updates
            document.getElementById('ratingSlider').addEventListener('input', function() {
                document.getElementById('ratingValue').innerHTML = this.value + ' <i class="fas fa-star"></i>';
            });

            document.getElementById('feesSlider').addEventListener('input', function() {
                document.getElementById('feesValue').textContent = '₹' + this.value + 'L';
            });

            // Filter buttons
            document.getElementById('applyBtn').addEventListener('click', applyFilters);
            document.getElementById('resetBtn').addEventListener('click', resetFilters);

            // Sort functionality
            document.getElementById('sortBy').addEventListener('change', function() {
                sortColleges(this.value);
            });

            // Real-time search
            document.getElementById('searchBox').addEventListener('input', applyFilters);

            // Modal close
            document.getElementById('modalClose').addEventListener('click', closeModal);
            window.addEventListener('click', function(e) {
                if (e.target === document.getElementById('collegeModal')) {
                    closeModal();
                }
            });
        }

        // Display Colleges
        function displayColleges(colleges) {
            const container = document.getElementById('collegesContainer');
            
            if (colleges.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h2>No Colleges Found</h2>
                        <p>Try adjusting your filters to see more results</p>
                    </div>
                `;
                document.getElementById('resultsCount').textContent = 'No Colleges Found';
                return;
            }

            container.innerHTML = colleges.map(college => `
                <div class="college-card">
                    <div class="college-header">
                        <div class="college-info">
                            <h3>${college.name}</h3>
                            <div class="college-meta">
                                <span><i class="fas fa-map-marker-alt"></i> ${college.location}</span>
                                <span><i class="fas fa-calendar"></i> Est. ${college.established}</span>
                                <span><i class="fas fa-university"></i> ${college.type}</span>
                            </div>
                        </div>
                        <div class="rating">
                            <span class="rating-stars">${generateStars(college.rating)}</span>
                            <span class="rating-value">${college.rating}</span>
                        </div>
                    </div>

                    <div class="college-details">
                        <div class="detail-item">
                            <span class="detail-label">Total Fees</span>
                            <span class="detail-value">₹${college.fees} Lakhs</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Programs</span>
                            <span class="detail-value">${college.courses.length} Courses</span>
                        </div>
                    </div>

                    <div class="courses-tags">
                        ${college.courses.slice(0, 4).map(course => `<span class="course-tag">${course}</span>`).join('')}
                    </div>

                    <div class="facilities">
                        ${college.facilities.map(facility => `
                            <div class="facility-item">
                                <i class="fas fa-${getFacilityIcon(facility)}"></i>
                                <span>${facility}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="fee-range">
                        <span class="detail-label">Fee Range</span>
                        <div class="fee-bar">
                            <div class="fee-fill" style="width: ${(college.fees / 20) * 100}%"></div>
                        </div>
                    </div>

                    <div class="card-footer">
                        <span class="medium-tag"><i class="fas fa-language"></i> ${college.medium}</span>
                        <button class="view-details-btn" onclick="showDetails(${college.id})">
                            View Details <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            document.getElementById('resultsCount').textContent = `Showing ${colleges.length} College${colleges.length !== 1 ? 's' : ''}`;
        }

        // Generate star icons
        function generateStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 !== 0;
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<i class="fas fa-star"></i>';
            }
            if (hasHalfStar) {
                stars += '<i class="fas fa-star-half-alt"></i>';
            }
            return stars;
        }

        // Get facility icon
        function getFacilityIcon(facility) {
            const iconMap = {
                'Hostel': 'home',
                'Library': 'book',
                'Lab': 'flask',
                'Sports': 'running',
                'WiFi': 'wifi',
                'Cafeteria': 'utensils'
            };
            return iconMap[facility] || 'check';
        }

        // Apply Filters using Database search method
        function applyFilters() {
            const searchTerm = document.getElementById('searchBox').value;
            const minRating = parseFloat(document.getElementById('ratingSlider').value);
            const maxFees = parseFloat(document.getElementById('feesSlider').value);
            const location = document.getElementById('locationFilter').value;

            // Get selected types
            const types = [];
            if (document.getElementById('typeGov').checked) types.push('Government');
            if (document.getElementById('typePrivate').checked) types.push('Private');
            if (document.getElementById('typeDeemed').checked) types.push('Deemed');

            // Get selected courses (dynamically)
            const courses = [];
            document.querySelectorAll('#courseCheckboxes input[type="checkbox"]:checked').forEach(cb => {
                courses.push(cb.value);
            });

            // Get selected mediums
            const mediums = [];
            if (document.getElementById('mediumEng').checked) mediums.push('English');
            if (document.getElementById('mediumHindi').checked) mediums.push('Hindi');
            if (document.getElementById('mediumOther').checked) mediums.push('Other');

            // Use database search method
            filteredColleges = db.searchColleges({
                search: searchTerm,
                types: types.length > 0 ? types : undefined,
                location: location || undefined,
                courses: courses.length > 0 ? courses : undefined,
                mediums: mediums.length > 0 ? mediums : undefined,
                minRating: minRating,
                maxFees: maxFees
            });

            displayColleges(filteredColleges);
        }

        // Reset Filters
        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('ratingSlider').value = 3;
            document.getElementById('feesSlider').value = 10;
            document.getElementById('locationFilter').value = '';
            document.getElementById('sortBy').value = 'default';
            
            document.getElementById('ratingValue').innerHTML = '3 <i class="fas fa-star"></i>';
            document.getElementById('feesValue').textContent = '₹10L';

            // Uncheck all checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);

            filteredColleges = db.getAllColleges();
            displayColleges(filteredColleges);
        }

        // Sort Colleges using database method
        function sortColleges(sortType) {
            let order = 'desc';
            
            switch(sortType) {
                case 'rating':
                    filteredColleges = db.sortColleges(filteredColleges, 'rating', 'desc');
                    break;
                case 'fees':
                    filteredColleges = db.sortColleges(filteredColleges, 'fees', 'asc');
                    break;
                case 'name':
                    filteredColleges = db.sortColleges(filteredColleges, 'name', 'asc');
                    break;
                default:
                    filteredColleges = db.getAllColleges();
            }

            displayColleges(filteredColleges);
        }

        // Show Details Modal
        function showDetails(collegeId) {
            const college = db.getCollegeById(collegeId);
            if (!college) return;

            document.getElementById('modalCollegeName').textContent = college.name;
            document.getElementById('modalCollegeDetails').innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <p style="color: #B8B8B8; font-size: 0.9rem;">Location</p>
                            <p style="color: #E4E4E4; font-weight: 600;">${college.location}</p>
                        </div>
                        <div>
                            <p style="color: #B8B8B8; font-size: 0.9rem;">Established</p>
                            <p style="color: #E4E4E4; font-weight: 600;">${college.established}</p>
                        </div>
                        <div>
                            <p style="color: #B8B8B8; font-size: 0.9rem;">Type</p>
                            <p style="color: #E4E4E4; font-weight: 600;">${college.type}</p>
                        </div>
                        <div>
                            <p style="color: #B8B8B8; font-size: 0.9rem;">Total Fees</p>
                            <p style="color: #0088A9; font-weight: 600; font-size: 1.2rem;">₹${college.fees} Lakhs</p>
                        </div>
                    </div>
                    
                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Rating</p>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="color: #FFA500; font-size: 1.5rem;">${generateStars(college.rating)}</span>
                            <span style="color: #E4E4E4; font-weight: 600; font-size: 1.2rem;">${college.rating}/5</span>
                        </div>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Accreditation</p>
                        <span style="color: #0088A9; font-weight: 600;">${college.accreditation}</span>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Placement Details</p>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                            <div>
                                <p style="color: #B8B8B8; font-size: 0.85rem;">Avg Package</p>
                                <p style="color: #0088A9; font-weight: 600;">₹${college.placements.averagePackage} LPA</p>
                            </div>
                            <div>
                                <p style="color: #B8B8B8; font-size: 0.85rem;">Highest Package</p>
                                <p style="color: #0088A9; font-weight: 600;">₹${college.placements.highestPackage} LPA</p>
                            </div>
                            <div>
                                <p style="color: #B8B8B8; font-size: 0.85rem;">Placement Rate</p>
                                <p style="color: #0088A9; font-weight: 600;">${college.placements.placementRate}%</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Courses Offered</p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            ${college.courses.map(course => `<span class="course-tag">${course}</span>`).join('')}
                        </div>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Facilities</p>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            ${college.facilities.map(facility => `
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <i class="fas fa-${getFacilityIcon(facility)}" style="color: #0088A9;"></i>
                                    <span style="color: #E4E4E4;">${facility}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">About</p>
                        <p style="color: #E4E4E4; line-height: 1.6;">${college.description}</p>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Contact Information</p>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i class="fas fa-globe" style="color: #0088A9;"></i>
                                <a href="${college.website}" target="_blank" style="color: #0088A9; text-decoration: none;">${college.website}</a>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i class="fas fa-envelope" style="color: #0088A9;"></i>
                                <span style="color: #E4E4E4;">${college.email}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i class="fas fa-phone" style="color: #0088A9;"></i>
                                <span style="color: #E4E4E4;">${college.phone}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <p style="color: #B8B8B8; font-size: 0.9rem; margin-bottom: 10px;">Medium of Instruction</p>
                        <span class="medium-tag"><i class="fas fa-language"></i> ${college.medium}</span>
                    </div>

                    <button class="btn btn-primary" style="margin-top: 20px;" onclick="closeModal()">
                        <i class="fas fa-times"></i> Close
                    </button>
                </div>
            `;

            document.getElementById('collegeModal').style.display = 'flex';
        }

        // Close Modal
        function closeModal() {
            document.getElementById('collegeModal').style.display = 'none';
        }

        // Initialize on page load
        init();
    </script>
</body>
</html>
