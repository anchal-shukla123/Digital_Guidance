<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EduGuide — Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <header class="site-header">
        <a><h3>EduGuide</h3></a>
        <nav>
            <ul class="nav_links"> 
                <li><a href="#quiz">Take Quiz</a></li>
                <li><a href="#colleges">Colleges</a></li>
                <li><a href="#timeline">Timeline</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <span class="welcome-text" id="welcomeText" style="display: none;"></span>
            <button id="profileBtn" class="navBtn" style="display: none;">Profile</button>
            <button id="loginBtn" class="navBtn">Login</button>
            <button id="logoutBtn" class="navBtn logout-btn" style="display: none;">Logout</button>
        </div>
    </header>

    <div class="slider-container">
        <div class="slider" id="slider">
            <div class="slide active">
                <img src="assets/ed1.jpg" alt="Education 1">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=1200&h=500&fit=crop" alt="Education 2">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?w=1200&h=500&fit=crop" alt="Education 3">
            </div>
            <div class="slide">
                <img src="assets/ed2.jpg" alt="Education 4">
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?w=1200&h=500&fit=crop" alt="Education 5">
            </div>
            <div class="slide">
                <img src="assets/ed3.jpg" alt="Education 4">
            </div>
            <div class="slide">
                <img src="assets/ed5.jpg" alt="Education 4">
            </div>
            <div class="main-headline">
                <span class="typed-text"></span>
                <span class="cursor">|</span>
            </div>
        </div>
        
        <div class="dots" id="dots"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container">
            <button class="modal-close" id="modalClose">×</button>
            
            <div class="modal-header">
                <h1>
                    <svg class="icon" fill="white" viewBox="0 0 24 24">
                        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                    </svg>
                    EduGuide
                </h1>
                <p>Your Path to Academic Success</p>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Login</button>
                <button class="tab" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <div class="form-container">
                <!-- Login Form -->
                <div id="loginForm" class="form-section active">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username">
                        <span class="error" id="loginUsernameError"></span>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password">
                        <span class="error" id="loginPasswordError"></span>
                    </div>

                    <button class="btn btn-primary" onclick="handleLogin()">Login</button>

                    <div class="divider"><span>Or continue with</span></div>

                    <button class="btn btn-google" onclick="handleGoogleAuth()">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Continue with Google
                    </button>
                </div>

                <!-- Signup Form -->
                <div id="signupForm" class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" id="firstName" placeholder="First name">
                            <span class="error" id="firstNameError"></span>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" id="lastName" placeholder="Last name">
                            <span class="error" id="lastNameError"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="signupUsername" placeholder="Choose a unique username">
                        <span class="error" id="signupUsernameError"></span>
                    </div>

                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" placeholder="your.email@example.com">
                        <span class="error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label>Student Category *</label>
                        <select id="studentCategory" onchange="handleCategoryChange()">
                            <option value="">Select Category</option>
                            <option value="school">School Student</option>
                            <option value="college">College Student</option>
                        </select>
                        <span class="error" id="categoryError"></span>
                    </div>

                    <!-- College Fields -->
                    <div id="collegeFields" class="category-fields">
                        <div class="form-group">
                            <label>University *</label>
                            <input type="text" id="university" placeholder="University name">
                            <span class="error" id="universityError"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Course *</label>
                                <input type="text" id="course" placeholder="e.g., B.Tech CSE">
                                <span class="error" id="courseError"></span>
                            </div>
                            <div class="form-group">
                                <label>Current CGPA *</label>
                                <input type="number" id="cgpa" step="0.01" placeholder="0.00 - 10.00">
                                <span class="error" id="cgpaError"></span>
                            </div>
                        </div>
                    </div>

                    <!-- School Fields -->
                    <div id="schoolFields" class="category-fields">
                        <div class="form-group">
                            <label>Stream *</label>
                            <select id="stream">
                                <option value="">Select Stream</option>
                                <option value="Science">Science</option>
                                <option value="Commerce">Commerce</option>
                                <option value="Arts">Arts</option>
                            </select>
                            <span class="error" id="streamError"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>10th Percentage *</label>
                                <input type="number" id="tenth" step="0.01" placeholder="0 - 100">
                                <span class="error" id="tenthError"></span>
                            </div>
                            <div class="form-group">
                                <label>12th Percentage *</label>
                                <input type="number" id="twelfth" step="0.01" placeholder="0 - 100">
                                <span class="error" id="twelfthError"></span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Board *</label>
                            <select id="board">
                                <option value="">Select Board</option>
                                <option value="CBSE">CBSE</option>
                                <option value="ICSE">ICSE</option>
                                <option value="State Board">State Board</option>
                                <option value="IB">IB</option>
                            </select>
                            <span class="error" id="boardError"></span>
                        </div>
                    </div>

                    <!-- Common Fields -->
                    <div id="commonFields" class="category-fields">
                        <div class="form-group">
                            <label>Gender *</label>
                            <select id="gender">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <span class="error" id="genderError"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>State *</label>
                                <select id="state">
                                    <option value="">Select State</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Gujarat">Gujarat</option>
                                </select>
                                <span class="error" id="stateError"></span>
                            </div>
                            <div class="form-group">
                                <label>City *</label>
                                <input type="text" id="city" placeholder="Your city">
                                <span class="error" id="cityError"></span>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Password *</label>
                                <input type="password" id="signupPassword" placeholder="Min 6 characters">
                                <span class="error" id="signupPasswordError"></span>
                            </div>
                            <div class="form-group">
                                <label>Confirm Password *</label>
                                <input type="password" id="confirmPassword" placeholder="Re-enter password">
                                <span class="error" id="confirmPasswordError"></span>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="handleSignup()">Sign Up</button>

                    <div class="divider"><span>Or continue with</span></div>

                    <button class="btn btn-google" onclick="handleGoogleAuth()">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Continue with Google
                    </button>
                </div>
            </div>
        </div>
    </div>

  <script src="script.js" defer></script>
</body>
</html>
