<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGuide - Login & Signup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #e8eaf6 50%, #f3e5f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2196F3 0%, #3F51B5 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            color: #bbdefb;
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #757575;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #2196F3;
            border-bottom: 3px solid #2196F3;
        }

        .tab:hover:not(.active) {
            background: #eeeeee;
        }

        .form-container {
            padding: 40px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #424242;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .error {
            color: #f44336;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2196F3 0%, #3F51B5 100%);
            color: white;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(33, 150, 243, 0.3);
        }

        .btn-google {
            background: white;
            border: 2px solid #e0e0e0;
            color: #424242;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            border-color: #bdbdbd;
            background: #fafafa;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #757575;
            font-size: 0.9rem;
        }

        .category-fields {
            display: none;
            animation: fadeIn 0.3s;
        }

        .category-fields.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 48px;
            height: 48px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <svg class="icon" fill="white" viewBox="0 0 24 24">
                    <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                </svg>
                EduGuide
            </h1>
            <p>Your Path to Academic Success</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <!-- Login Form -->
            <div id="loginForm" class="form-section active">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username">
                    <span class="error" id="loginUsernameError"></span>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                    <span class="error" id="loginPasswordError"></span>
                </div>

                <button class="btn btn-primary" onclick="handleLogin()">Login</button>

                <div class="divider"><span>Or continue with</span></div>

                <button class="btn btn-google" onclick="handleGoogleAuth()">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="form-section">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name *</label>
                        <input type="text" id="firstName" placeholder="First name">
                        <span class="error" id="firstNameError"></span>
                    </div>
                    <div class="form-group">
                        <label>Last Name *</label>
                        <input type="text" id="lastName" placeholder="Last name">
                        <span class="error" id="lastNameError"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" id="signupUsername" placeholder="Choose a unique username">
                    <span class="error" id="signupUsernameError"></span>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" placeholder="your.email@example.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label>Student Category *</label>
                    <select id="studentCategory" onchange="handleCategoryChange()">
                        <option value="">Select Category</option>
                        <option value="school">School Student</option>
                        <option value="college">College Student</option>
                    </select>
                    <span class="error" id="categoryError"></span>
                </div>

                <!-- College Fields -->
                <div id="collegeFields" class="category-fields">
                    <div class="form-group">
                        <label>University *</label>
                        <input type="text" id="university" placeholder="University name">
                        <span class="error" id="universityError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Course *</label>
                            <input type="text" id="course" placeholder="e.g., B.Tech CSE">
                            <span class="error" id="courseError"></span>
                        </div>
                        <div class="form-group">
                            <label>Current CGPA *</label>
                            <input type="number" id="cgpa" step="0.01" placeholder="0.00 - 10.00">
                            <span class="error" id="cgpaError"></span>
                        </div>
                    </div>
                </div>

                <!-- School Fields -->
                <div id="schoolFields" class="category-fields">
                    <div class="form-group">
                        <label>Stream *</label>
                        <select id="stream">
                            <option value="">Select Stream</option>
                            <option value="Science">Science</option>
                            <option value="Commerce">Commerce</option>
                            <option value="Arts">Arts</option>
                        </select>
                        <span class="error" id="streamError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>10th Percentage *</label>
                            <input type="number" id="tenth" step="0.01" placeholder="0 - 100">
                            <span class="error" id="tenthError"></span>
                        </div>
                        <div class="form-group">
                            <label>12th Percentage *</label>
                            <input type="number" id="twelfth" step="0.01" placeholder="0 - 100">
                            <span class="error" id="twelfthError"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Board *</label>
                        <select id="board">
                            <option value="">Select Board</option>
                            <option value="CBSE">CBSE</option>
                            <option value="ICSE">ICSE</option>
                            <option value="State Board">State Board</option>
                            <option value="IB">IB</option>
                        </select>
                        <span class="error" id="boardError"></span>
                    </div>
                </div>

                <!-- Common Fields -->
                <div id="commonFields" class="category-fields">
                    <div class="form-group">
                        <label>Gender *</label>
                        <select id="gender">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <span class="error" id="genderError"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>State *</label>
                            <select id="state">
                                <option value="">Select State</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                <option value="Assam">Assam</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Chhattisgarh">Chhattisgarh</option>
                                <option value="Goa">Goa</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Jharkhand">Jharkhand</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Manipur">Manipur</option>
                                <option value="Meghalaya">Meghalaya</option>
                                <option value="Mizoram">Mizoram</option>
                                <option value="Nagaland">Nagaland</option>
                                <option value="Odisha">Odisha</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Sikkim">Sikkim</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Tripura">Tripura</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Uttarakhand">Uttarakhand</option>
                                <option value="West Bengal">West Bengal</option>
                            </select>
                            <span class="error" id="stateError"></span>
                        </div>
                        <div class="form-group">
                            <label>City *</label>
                            <input type="text" id="city" placeholder="Your city">
                            <span class="error" id="cityError"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="signupPassword" placeholder="Min 6 characters">
                            <span class="error" id="signupPasswordError"></span>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password *</label>
                            <input type="password" id="confirmPassword" placeholder="Re-enter password">
                            <span class="error" id="confirmPasswordError"></span>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="handleSignup()">Sign Up</button>

                <div class="divider"><span>Or continue with</span></div>

                <button class="btn btn-google" onclick="handleGoogleAuth()">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </div>

    <script>
        // Store registered usernames
        let registeredUsers = new Set();

        // Switch between login and signup tabs
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const sections = document.querySelectorAll('.form-section');
            
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
                clearErrors();
            } else {
                tabs[1].classList.add('active');
                document.getElementById('signupForm').classList.add('active');
                clearErrors();
            }
        }

        // Handle category change
        function handleCategoryChange() {
            const category = document.getElementById('studentCategory').value;
            const collegeFields = document.getElementById('collegeFields');
            const schoolFields = document.getElementById('schoolFields');
            const commonFields = document.getElementById('commonFields');
            
            // Hide all category-specific fields first
            collegeFields.classList.remove('show');
            schoolFields.classList.remove('show');
            commonFields.classList.remove('show');
            
            // Show relevant fields
            if (category === 'college') {
                collegeFields.classList.add('show');
                commonFields.classList.add('show');
            } else if (category === 'school') {
                schoolFields.classList.add('show');
                commonFields.classList.add('show');
            }
            
            clearErrors();
        }

        // Clear all error messages
        function clearErrors() {
            const errors = document.querySelectorAll('.error');
            errors.forEach(error => {
                error.classList.remove('show');
                error.textContent = '';
            });
        }

        // Show error message
        function showError(fieldId, message) {
            const errorElement = document.getElementById(fieldId + 'Error');
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
            }
        }

        // Validate email format
        function isValidEmail(email) {
            return /\S+@\S+\.\S+/.test(email);
        }

        // Handle Login
        function handleLogin() {
            clearErrors();
            let isValid = true;
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!username) {
                showError('loginUsername', 'Username is required');
                isValid = false;
            }
            
            if (!password) {
                showError('loginPassword', 'Password is required');
                isValid = false;
            }
            
            if (isValid) {
                alert(`Login successful!\nUsername: ${username}`);
                // Clear form
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
            }
        }

        // Handle Signup
        function handleSignup() {
            clearErrors();
            let isValid = true;
            
            // Get all form values
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const username = document.getElementById('signupUsername').value.trim();
            const email = document.getElementById('email').value.trim();
            const category = document.getElementById('studentCategory').value;
            const gender = document.getElementById('gender').value;
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Basic validations
            if (!firstName) {
                showError('firstName', 'First name is required');
                isValid = false;
            }
            
            if (!lastName) {
                showError('lastName', 'Last name is required');
                isValid = false;
            }
            
            if (!username) {
                showError('signupUsername', 'Username is required');
                isValid = false;
            } else if (registeredUsers.has(username.toLowerCase())) {
                showError('signupUsername', 'Username already taken. Please choose another.');
                isValid = false;
            }
            
            if (!email) {
                showError('email', 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('email', 'Invalid email format');
                isValid = false;
            }
            
            if (!category) {
                showError('category', 'Select student category');
                isValid = false;
            }
            
            // Category-specific validations
            if (category === 'college') {
                const university = document.getElementById('university').value.trim();
                const course = document.getElementById('course').value.trim();
                const cgpa = document.getElementById('cgpa').value;
                
                if (!university) {
                    showError('university', 'University is required');
                    isValid = false;
                }
                
                if (!course) {
                    showError('course', 'Course is required');
                    isValid = false;
                }
                
                if (!cgpa) {
                    showError('cgpa', 'CGPA is required');
                    isValid = false;
                } else if (cgpa < 0 || cgpa > 10) {
                    showError('cgpa', 'CGPA must be between 0-10');
                    isValid = false;
                }
            } else if (category === 'school') {
                const stream = document.getElementById('stream').value;
                const tenth = document.getElementById('tenth').value;
                const twelfth = document.getElementById('twelfth').value;
                const board = document.getElementById('board').value;
                
                if (!stream) {
                    showError('stream', 'Stream is required');
                    isValid = false;
                }
                
                if (!tenth) {
                    showError('tenth', '10th percentage is required');
                    isValid = false;
                } else if (tenth < 0 || tenth > 100) {
                    showError('tenth', 'Invalid percentage');
                    isValid = false;
                }
                
                if (!twelfth) {
                    showError('twelfth', '12th percentage is required');
                    isValid = false;
                } else if (twelfth < 0 || twelfth > 100) {
                    showError('twelfth', 'Invalid percentage');
                    isValid = false;
                }
                
                if (!board) {
                    showError('board', 'Board is required');
                    isValid = false;
                }
            }
            
            // Common field validations
            if (category) {
                if (!gender) {
                    showError('gender', 'Gender is required');
                    isValid = false;
                }
                
                if (!state) {
                    showError('state', 'State is required');
                    isValid = false;
                }
                
                if (!city) {
                    showError('city', 'City is required');
                    isValid = false;
                }
                
                if (!password) {
                    showError('signupPassword', 'Password is required');
                    isValid = false;
                } else if (password.length < 6) {
                    showError('signupPassword', 'Password must be at least 6 characters');
                    isValid = false;
                }
                
                if (password !== confirmPassword) {
                    showError('confirmPassword', 'Passwords do not match');
                    isValid = false;
                }
            }
            
            if (isValid) {
                // Add username to registered users
                registeredUsers.add(username.toLowerCase());
                
                alert(`Registration successful!\nWelcome to EduGuide, ${firstName}!`);
                
                // Reset form and switch to login
                document.getElementById('signupForm').querySelectorAll('input, select').forEach(input => {
                    input.value = '';
                });
                document.getElementById('collegeFields').classList.remove('show');
                document.getElementById('schoolFields').classList.remove('show');
                document.getElementById('commonFields').classList.remove('show');
                
                switchTab('login');
            }
        }

        // Handle Google Authentication
        function handleGoogleAuth() {
            alert('Google Authentication would be integrated here.\nRedirecting to Google Sign-In...');
        }
    </script>
</body>
</html>
